<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="login.js" defer></script>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
        <h1>Quiz de Desenvolvimento de Sistemas</h1>
    </header>

    <main>
        <div id="c">
            <form>
                <h2>Login</h2>

                <div class="campo">
                    <label for="login">Informe o nome de usuario ou email:</label>
                    <input type="text" id="login">
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" minlength="7" id="senha">
                </div>

                <button type="submit">Entrar</button>
                <p>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Todos os Direitos Reservados</p>
        <p>Desenvolvido por: <a href="https://github.com/Schutz-br">Kryzn</a></p>
    </footer>

</body>

</html>
